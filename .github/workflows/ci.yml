name: ci

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential
      - name: build
        run: make
      - name: unit tests
        run: make test
      - name: kernel tests
        run: make test-kernel

  agda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: haskell/actions/setup@v2
        with:
          ghc-version: "9.6.6"
          cabal-version: "3.10"
      - name: install agda
        run: |
          cabal update
          cabal install Agda-2.8.0 --overwrite-policy=always
          echo "$HOME/.cabal/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: fetch agda-stdlib 2.3
        run: |
          git clone --depth 1 --branch v2.3 https://github.com/agda/agda-stdlib.git "$HOME/agda-stdlib"
      - name: typecheck
        run: make agda AGDA_STDLIB="$HOME/agda-stdlib/src"
